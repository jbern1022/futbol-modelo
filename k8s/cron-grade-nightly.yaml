apiVersion: batch/v1
kind: CronJob
metadata: { name: grade-nightly, namespace: futbol }
spec:
  schedule: "0 4 * * *"          # 04:00, after ingest
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: grade
            image: gitea.lab/bernal-labs/futbol-modelo:latest
            command: ["python","scripts/auto_grade.py"]
            resources:
              requests: { cpu: 250m, memory: 256Mi }
              limits: { cpu: 1000m, memory: 1Gi }
            env:
            - name: FUTBOL_DSN
              valueFrom: { secretKeyRef: { name: futbol-db, key: dsn } }
