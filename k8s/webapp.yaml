apiVersion: apps/v1
kind: Deployment
metadata:
  name: futbol-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: futbol-api
  template:
    metadata:
      labels:
        app: futbol-api
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-control-plane
      imagePullSecrets:
      - name: gitea-registry
      containers:
      - name: futbol-api
        image: gitea.josephbernal.com/joe/futbol-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        # Read path goes through pgBouncer's futbol_ro alias, same
        # front-end-identity pattern as the CronJobs (k8s/cronjobs.yaml):
        # futbol_ro_canary authenticates to pgBouncer, whose [databases]
        # entry pins the backend to the real futbol_ro role. dbname MUST
        # be futbol_ro -- dbname=futbol would route to the RW alias and
        # silently give the API read-write privileges. The password var
        # has to be listed before FUTBOL_RO_DSN for $(...) expansion.
        - name: PGBOUNCER_RO_CANARY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: futbol-secrets
              key: PGBOUNCER_RO_CANARY_PASSWORD
        - name: FUTBOL_RO_DSN
          value: "host=futbol-pgbouncer-svc port=6432 dbname=futbol_ro user=futbol_ro_canary password=$(PGBOUNCER_RO_CANARY_PASSWORD)"
        - name: FUTBOL_OLLAMA_URL
          valueFrom:
            secretKeyRef:
              name: futbol-secrets
              key: FUTBOL_OLLAMA_URL
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: futbol-api-svc
  namespace: default
spec:
  selector:
    app: futbol-api
  ports:
  - port: 8000
    targetPort: 8000
---
# Separate from futbol-api-svc (ClusterIP, used internally by futbol-web)
# so the metrics/health surface can be reached from outside the cluster
# (the docker-host Prometheus instance) via NodePort. Same read-only API,
# just externally routable without going through Cloudflare/NPM -- fine
# for a read-only public-data API, but bypasses that layer, so keep this
# to scraping, not general traffic.
apiVersion: v1
kind: Service
metadata:
  name: futbol-api-metrics-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: futbol-api
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30800
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: futbol-web
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: futbol-web
  template:
    metadata:
      labels:
        app: futbol-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-control-plane
      imagePullSecrets:
      - name: gitea-registry
      containers:
      - name: futbol-web
        image: gitea.josephbernal.com/joe/futbol-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://futbol-api-svc:8000"
        - name: HOSTNAME
          value: "0.0.0.0"
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: futbol-web-svc
  namespace: default
spec:
  selector:
    app: futbol-web
  ports:
  - port: 3000
    targetPort: 3000
