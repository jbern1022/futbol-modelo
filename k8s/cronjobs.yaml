                name: futbol-secrets
---
# Odds cadence (2026-09-16 decision): daily wide sweep to pick up
# opening lines on newly-scheduled fixtures as early as possible, plus
# an every-2-hours same-day sweep so match_odds_history actually
# captures real intra-day line movement for v_closing_line_value
# (migration 0026) instead of a single snapshot. One real API-Football
# call per matching fixture each run (see fetch_and_store_odds'
# docstring) -- days-ahead=1 keeps the 2-hourly job's fixture count
# small (only today's games), so the recurring cost is bounded by
# match volume, not by days-ahead.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: futbol-odds-daily
  namespace: default
spec:
  schedule: "45 12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: k3s-control-plane
          imagePullSecrets:
          - name: gitea-registry
          containers:
          - name: odds-daily
            image: gitea.josephbernal.com/joe/futbol-modelo:latest
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "-c"]
            args:
              - |
                python -m ingestion.api_football odds --league EPL --days-ahead 7 &&
                python -m ingestion.api_football odds --league SERIE_A --days-ahead 7 &&
                python -m ingestion.api_football odds --league MLS --days-ahead 7 &&
                python -m ingestion.api_football odds --league LA_LIGA --days-ahead 7
            # pgBouncer rollout, 3rd consumer (2026-09-22). See
            # k8s/pgbouncer.yaml for the futbol_canary auth design.
            env:
            - name: PGBOUNCER_CANARY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: futbol-secrets
                  key: PGBOUNCER_CANARY_PASSWORD
            - name: FUTBOL_DSN
              value: "host=futbol-pgbouncer-svc port=6432 dbname=futbol user=futbol_canary password=$(PGBOUNCER_CANARY_PASSWORD)"
            envFrom:
            - secretRef:
                name: futbol-secrets
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: futbol-odds-intraday
  namespace: default
spec:
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: k3s-control-plane
          imagePullSecrets:
          - name: gitea-registry
          containers:
          - name: odds-intraday
            image: gitea.josephbernal.com/joe/futbol-modelo:latest
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "-c"]
            args:
              - |
                python -m ingestion.api_football odds --league EPL --days-ahead 1 &&
                python -m ingestion.api_football odds --league SERIE_A --days-ahead 1 &&
                python -m ingestion.api_football odds --league MLS --days-ahead 1 &&
                python -m ingestion.api_football odds --league LA_LIGA --days-ahead 1
            # pgBouncer rollout, 2nd consumer after futbol-pipeline-health
            # (2026-09-22) -- picked next since it runs every 2h, so a
            # problem surfaces and gets caught fast. Same futbol_canary
            # pattern as the canary; see k8s/pgbouncer.yaml.
            env:
            - name: PGBOUNCER_CANARY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: futbol-secrets
                  key: PGBOUNCER_CANARY_PASSWORD
            - name: FUTBOL_DSN
              value: "host=futbol-pgbouncer-svc port=6432 dbname=futbol user=futbol_canary password=$(PGBOUNCER_CANARY_PASSWORD)"
            envFrom:
            - secretRef:
                name: futbol-secrets
---
# Runs once daily, 13:15 UTC -- an hour+ after the whole daily chain
# (nightly-refresh 12:00 -> auto-slate 12:15 -> auto-grade 12:30 ->
# odds-daily 12:45) should have finished, giving real buffer before
# checking freshness. scripts/check_pipeline_health.py itself was
# previously never scheduled anywhere (repo code only, no CronJob, no
# docker-host crontab entry) -- this closes that gap. Without
# NTFY_URL/NTFY_TOPIC set in futbol-secrets it only prints to the pod's
# own logs (`kubectl logs -l job-name=<job>`); add those two keys to
# the secret once a real ntfy server/topic exists to get push alerts.
#
# pgBouncer canary (2026-09-22, Todoist: "pgBouncer deployed but NOT
# wired to live traffic"): this is the one consumer routed through
# futbol-pgbouncer-svc:6432 instead of direct Postgres -- lowest-risk
# candidate (read-only, once daily, easy to spot if it breaks). FUTBOL_DSN
# is overridden here via `env` (which wins over the shared `envFrom`
# below for the same key) rather than changing the secret's FUTBOL_DSN
# itself, so every other consumer stays on direct Postgres untouched.
# Uses a dedicated futbol_canary front-end identity (see
# k8s/pgbouncer.yaml) rather than the real DB password, so this canary
# never needed the production credential to be read or copied anywhere.
# Once this proves stable, roll the real FUTBOL_DSN/FUTBOL_RO_DSN over
# for the rest, one consumer at a time -- see k8s/pgbouncer.yaml's own
# header for the full rollout note.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: futbol-pipeline-health
  namespace: default
spec:
  schedule: "15 13 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: k3s-control-plane
          imagePullSecrets:
          - name: gitea-registry
          containers:
          - name: pipeline-health
            image: gitea.josephbernal.com/joe/futbol-modelo:latest
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "-c"]
            args:
              - |
                python scripts/check_pipeline_health.py
            env:
            - name: PGBOUNCER_CANARY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: futbol-secrets
                  key: PGBOUNCER_CANARY_PASSWORD
            - name: FUTBOL_DSN
              value: "host=futbol-pgbouncer-svc port=6432 dbname=futbol user=futbol_canary password=$(PGBOUNCER_CANARY_PASSWORD)"
            envFrom:
            - secretRef:
                name: futbol-secrets
