# Ships this k3s cluster's pod logs to the existing Loki instance on
# docker-host (Todoist: "Structured JSON logging shipped to
# Loki/Grafana"). Cluster-wide, not futbol-modelo-specific -- every
# namespace's pod logs get shipped, not just default/futbol-modelo --
# kept in this repo since futbol-modelo is what's actively driving the
# need for it, but it's genuinely cluster infra.
#
# The existing Promtail on docker-host (~/loki/promtail-config) only
# scrapes docker-host's own Docker socket via docker_sd_configs -- it
# has never seen anything running in this k3s cluster. This is a
# second, independent Promtail: a DaemonSet using kubernetes_sd_configs
# for pod discovery, tailing each node's local container log files
# directly (containerd writes to /var/log/pods, with symlinks at
# /var/log/containers) -- no cross-node log shipping needed, each
# Promtail replica only ever reads its own node's logs.
#
# Loki itself has no cross-host DNS entry (its docker-compose stack has
# no name resolvable from here) -- pointed at docker-host's LAN IP
# directly (192.168.4.20:3100), same pattern already used for ntfy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: kube-system
data:
  promtail-config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://192.168.4.20:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # futbol-modelo's scripts log JSON lines (see src/ops/json_logging.py)
          # -- parse them so `level`/`job`/etc. become real, queryable Loki
          # labels/fields instead of being stuck inside an opaque message
          # string. Non-JSON lines (any other pod's plain-text logs) just
          # fail this stage silently and pass through unparsed, so this is
          # safe cluster-wide, not futbol-modelo-only.
          - json:
              expressions:
                level: level
                logger: logger
                job_name: job
          - labels:
              level:
              logger:
              job_name:
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_job_name]
            target_label: cronjob
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: promtail
          image: grafana/promtail:latest
          args:
            - -config.file=/etc/promtail/promtail-config.yml
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/log/containers
              readOnly: true
            - name: positions
              mountPath: /run/promtail
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: containers
          hostPath:
            path: /var/log/containers
        - name: positions
          hostPath:
            path: /run/promtail
